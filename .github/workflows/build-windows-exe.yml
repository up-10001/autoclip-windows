name: Build Windows EXE (RTX 3060)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies with onnxruntime-gpu for RTX 3060
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip uninstall -y onnxruntime || true
          pip install "onnxruntime-gpu>=1.19.0"

      - name: Download Windows FFmpeg and Real-ESRGAN binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "bin/ffmpeg.zip"
          Expand-Archive -Path "bin/ffmpeg.zip" -DestinationPath "bin/tmp" -Force
          $ff = Get-ChildItem -Path "bin/tmp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $fp = Get-ChildItem -Path "bin/tmp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ff.FullName "bin/ffmpeg.exe" -Force
          Copy-Item $fp.FullName "bin/ffprobe.exe" -Force
          Remove-Item "bin/tmp" -Recurse -Force
          Remove-Item "bin/ffmpeg.zip" -Force

      - name: Build AutoClip.exe
        run: pyinstaller --noconfirm --clean AutoClip.spec

      - name: Package v2.0.0 GPU hot-patch zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path patch_pkg/_internal | Out-Null
          Copy-Item "dist/AutoClip/AutoClip.exe" "patch_pkg/AutoClip.exe" -Force
          Get-ChildItem "dist/AutoClip/_internal" -Directory | Where-Object {
            $_.Name -match "^(rapidocr|cv2|pyclipper|shapely|yaml|PIL|onnxruntime)" -or $_.Name -like "*.libs"
          } | Where-Object {
            $_.Name -notmatch "^(nvidia|ctranslate2|av|tokenizers)"
          } | ForEach-Object {
            Write-Host "Packing dir: $($_.Name)"
            Copy-Item $_.FullName "patch_pkg/_internal/$($_.Name)" -Recurse -Force
          }
          Get-ChildItem "dist/AutoClip/_internal" -File | Where-Object {
            $_.Name -match "^(pyclipper|cv2|_yaml|geos|shapely|six|libgeos|msvcp|vcruntime|onnxruntime)"
          } | ForEach-Object {
            Write-Host "Packing file: $($_.Name)"
            Copy-Item $_.FullName "patch_pkg/_internal/" -Force
          }
          Compress-Archive -Path "patch_pkg/*" -DestinationPath "AutoClip-v2.0.0-GPU-patch.zip" -Force

      - name: Publish v2.0.0 GPU Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          if (gh release view v2.0.0 2>$null) {
            gh release upload v2.0.0 AutoClip-v2.0.0-GPU-patch.zip --clobber
          } else {
            gh release create v2.0.0 AutoClip-v2.0.0-GPU-patch.zip --title "AutoClip v2.0.0 GPU Final Patch" --notes "RTX 3060 GPU OCR acceleration, floating multi-account watermarks, seamless 160px feathered mask, anti-flash subtitle timing, and redesigned Chinese UI."
          }
