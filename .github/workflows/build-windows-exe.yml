name: Build Windows EXE (RTX 3060)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download Windows FFmpeg and Real-ESRGAN binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "bin/ffmpeg.zip"
          Expand-Archive -Path "bin/ffmpeg.zip" -DestinationPath "bin/tmp" -Force
          $ff = Get-ChildItem -Path "bin/tmp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $fp = Get-ChildItem -Path "bin/tmp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ff.FullName "bin/ffmpeg.exe" -Force
          Copy-Item $fp.FullName "bin/ffprobe.exe" -Force
          Remove-Item "bin/tmp" -Recurse -Force
          Remove-Item "bin/ffmpeg.zip" -Force

          New-Item -ItemType Directory -Force -Path bin/realesrgan | Out-Null
          try {
            Invoke-WebRequest -Uri "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-windows.zip" -OutFile "bin/realesrgan.zip"
            Expand-Archive -Path "bin/realesrgan.zip" -DestinationPath "bin/realesrgan" -Force
            Remove-Item "bin/realesrgan.zip" -Force
          } catch {
            Write-Host "Real-ESRGAN download skipped: $_"
          }

      - name: Build AutoClip.exe
        run: pyinstaller --noconfirm --clean AutoClip.spec

      - name: Package v1.0.4 OCR hot-patch zip (with shapely.libs DLLs)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path patch_pkg/_internal | Out-Null
          Copy-Item "dist/AutoClip/AutoClip.exe" "patch_pkg/AutoClip.exe" -Force
          Get-ChildItem "dist/AutoClip/_internal" -Directory | Where-Object {
            $_.Name -match "^(rapidocr|cv2|pyclipper|shapely|yaml|PIL)" -or $_.Name -like "*.libs"
          } | Where-Object {
            $_.Name -notmatch "^(nvidia|ctranslate2|onnxruntime|av|tokenizers)"
          } | ForEach-Object {
            Write-Host "Packing dir: $($_.Name)"
            Copy-Item $_.FullName "patch_pkg/_internal/$($_.Name)" -Recurse -Force
          }
          Get-ChildItem "dist/AutoClip/_internal" -File | Where-Object {
            $_.Name -match "^(pyclipper|cv2|_yaml|geos|shapely|six|libgeos|msvcp|vcruntime)"
          } | ForEach-Object {
            Write-Host "Packing file: $($_.Name)"
            Copy-Item $_.FullName "patch_pkg/_internal/" -Force
          }
          Compress-Archive -Path "patch_pkg/*" -DestinationPath "AutoClip-v1.0.4-patch.zip" -Force

      - name: Publish v1.0.4 hot-patch Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          if (gh release view v1.0.4 2>$null) {
            gh release upload v1.0.4 AutoClip-v1.0.4-patch.zip --clobber
          } else {
            gh release create v1.0.4 AutoClip-v1.0.4-patch.zip --title "AutoClip v1.0.4 Hotfix (Fix OCR shapely DLL)" --notes "Include shapely.libs GEOS DLLs so onscreen English subtitle OCR works out of the box. Unzip into AutoClip folder and replace all."
          }
