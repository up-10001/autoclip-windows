name: Build Windows EXE (RTX 3060)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies with onnxruntime-directml for Windows GPU
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip uninstall -y onnxruntime onnxruntime-gpu || true
          pip install "onnxruntime-directml>=1.19.0"

      - name: Download Windows FFmpeg and Real-ESRGAN binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "bin/ffmpeg.zip"
          Expand-Archive -Path "bin/ffmpeg.zip" -DestinationPath "bin/tmp" -Force
          $ff = Get-ChildItem -Path "bin/tmp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $fp = Get-ChildItem -Path "bin/tmp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ff.FullName "bin/ffmpeg.exe" -Force
          Copy-Item $fp.FullName "bin/ffprobe.exe" -Force
          Remove-Item "bin/tmp" -Recurse -Force
          Remove-Item "bin/ffmpeg.zip" -Force

      - name: Build AutoClip.exe
        run: pyinstaller --noconfirm --clean AutoClip.spec

      - name: Publish v3.1.0 Pro EXE hotfix (~10MB)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          Copy-Item "dist/AutoClip/AutoClip.exe" "AutoClip-v3.1.0.exe" -Force
          if (gh release view v3.1.0 2>$null) {
            gh release upload v3.1.0 AutoClip-v3.1.0.exe --clobber
          } else {
            gh release create v3.1.0 AutoClip-v3.1.0.exe --title "AutoClip Pro v3.1.0 Stability Release (Zero File Collisions + No UI Flicker)" --notes "1. Fix long TikTok filename truncation collision that overwrote/ate videos`n2. Fix right toolbar hiding & flickering on long filenames via fixed grid layout`n3. Atomic temp-file write + DeepSeek exponential backoff retry + accurate per-account summary."
          }
