name: Build Windows EXE (RTX 3060)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download Windows FFmpeg and Real-ESRGAN binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "bin/ffmpeg.zip"
          Expand-Archive -Path "bin/ffmpeg.zip" -DestinationPath "bin/tmp" -Force
          $ff = Get-ChildItem -Path "bin/tmp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $fp = Get-ChildItem -Path "bin/tmp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ff.FullName "bin/ffmpeg.exe" -Force
          Copy-Item $fp.FullName "bin/ffprobe.exe" -Force
          Remove-Item "bin/tmp" -Recurse -Force
          Remove-Item "bin/ffmpeg.zip" -Force

          New-Item -ItemType Directory -Force -Path bin/realesrgan | Out-Null
          try {
            Invoke-WebRequest -Uri "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-windows.zip" -OutFile "bin/realesrgan.zip"
            Expand-Archive -Path "bin/realesrgan.zip" -DestinationPath "bin/realesrgan" -Force
            Remove-Item "bin/realesrgan.zip" -Force
          } catch {
            Write-Host "Real-ESRGAN download skipped: $_"
          }

      - name: Build AutoClip.exe
        run: pyinstaller --noconfirm --clean AutoClip.spec

      - name: Publish hot-patch AutoClip.exe (tiny ~10MB)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          Copy-Item "dist/AutoClip/AutoClip.exe" "AutoClip-hotfix.exe" -Force
          if (gh release view v1.0.1 2>$null) {
            gh release upload v1.0.1 AutoClip-hotfix.exe --clobber
          } else {
            gh release create v1.0.1 AutoClip-hotfix.exe --title "AutoClip v1.0.1 热补丁 (仅需替换 AutoClip.exe)" --notes "1. 修复中文字幕跟不上英文与漏句问题（ID锁定Whisper真实时间轴 + 漏句自动补翻 + 优化VAD防吞短句）`n2. 内置 CUDA DLL 路径自动注册`n3. 新增超宽单行自适应缩放，防止字出画面`n使用方法：下载后改名为 AutoClip.exe，覆盖原文件夹里的 AutoClip.exe 即可，无需重新下载 1.4G 完整包！"
          }
